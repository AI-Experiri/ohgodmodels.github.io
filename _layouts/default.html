<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{ page.title | default: site.title }}</title>
        <meta
            name="description"
            content="{{ page.description | default: site.description }}"
        />
        <meta name="theme-color" content="#0b0618" />

        <!-- Favicon -->
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>😇</text></svg>"
        />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap"
            rel="stylesheet"
        />

        <style>
            :root {
                --night: #0b0618;
                --panel: #140a2b;
                --line: #3a2a6b;
                --text: #ded8f5;
                --dim: #9a8fc2;
                --magenta: #ff2e88;
                --cyan: #19e6ff;
                --yellow: #f5e94a;
                --notch: 14px;
                --display: "Chakra Petch", "Trebuchet MS", sans-serif;
                --body: "IBM Plex Sans", system-ui, sans-serif;
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            html {
                -webkit-text-size-adjust: 100%;
            }

            body {
                margin: 0;
                background-color: var(--night);
                background-image:
                    radial-gradient(
                        60rem 30rem at 100% 0%,
                        rgba(255, 46, 136, 0.16),
                        transparent 70%
                    ),
                    radial-gradient(
                        50rem 30rem at 0% 30%,
                        rgba(25, 230, 255, 0.1),
                        transparent 70%
                    ),
                    linear-gradient(rgba(58, 42, 107, 0.22) 1px, transparent 1px),
                    linear-gradient(
                        90deg,
                        rgba(58, 42, 107, 0.22) 1px,
                        transparent 1px
                    );
                background-size:
                    auto,
                    auto,
                    44px 44px,
                    44px 44px;
                color: var(--text);
                font-family: var(--body);
                font-size: 1rem;
                line-height: 1.55;
                -webkit-font-smoothing: antialiased;
            }

            /* Scanlines over the whole page */
            body::after {
                content: "";
                position: fixed;
                inset: 0;
                pointer-events: none;
                background: repeating-linear-gradient(
                    transparent 0 2px,
                    rgba(0, 0, 0, 0.16) 2px 3px
                );
                z-index: 10;
            }

            a {
                color: var(--cyan);
                text-underline-offset: 0.18em;
            }
            a:hover {
                color: var(--yellow);
            }
            :focus-visible {
                outline: 2px solid var(--yellow);
                outline-offset: 3px;
            }

            h1,
            h2,
            h3 {
                font-family: var(--display);
                margin: 0;
                line-height: 1.1;
            }
            p {
                margin: 0;
            }

            .wrap {
                width: min(100% - 2rem, 70rem);
                margin-inline: auto;
            }
            section.wrap {
                margin-top: 3.5rem;
            }
            section.wrap > h2,
            .columns h2 {
                font-size: 1.5rem;
                font-weight: 600;
                color: var(--yellow);
            }
            .section-lead {
                margin-top: 0.5rem;
                max-width: 62ch;
                color: var(--dim);
            }

            /* Notched panel: outer layer is the border, inner is the fill */
            .plate {
                --edge: var(--line);
                padding: 1px;
                background: var(--edge);
                clip-path: polygon(
                    0 0,
                    calc(100% - var(--notch)) 0,
                    100% var(--notch),
                    100% 100%,
                    var(--notch) 100%,
                    0 calc(100% - var(--notch))
                );
            }
            .plate-body {
                height: 100%;
                padding: 1.25rem;
                background: var(--panel);
                clip-path: inherit;
            }
            .plate-cyan {
                --edge: var(--cyan);
            }

            /* Hero */
            .hero {
                padding-top: 1.25rem;
            }
            .brand {
                font-family: var(--display);
                font-weight: 600;
                letter-spacing: 0.04em;
            }
            .brand-version {
                margin-left: 0.4rem;
                color: var(--dim);
                font-weight: 400;
            }
            .hero-grid {
                display: grid;
                gap: 2rem;
                margin-top: 1.5rem;
                align-items: end;
            }
            .glitch {
                position: relative;
                display: inline-block;
                font-size: clamp(4.5rem, 21vw, 11rem);
                font-weight: 700;
                letter-spacing: -0.02em;
                line-height: 0.9;
                color: #fff;
                text-shadow:
                    0.035em 0 var(--magenta),
                    -0.035em 0 var(--cyan);
            }
            .glitch::before,
            .glitch::after {
                content: attr(data-text);
                position: absolute;
                inset: 0;
                text-shadow: none;
                opacity: 0;
            }
            .glitch::before {
                color: var(--magenta);
                animation: glitch-a 1.1s steps(1) 0.2s 1;
            }
            .glitch::after {
                color: var(--cyan);
                animation: glitch-b 1.1s steps(1) 0.2s 1;
            }
            @keyframes glitch-a {
                0% {
                    opacity: 0.9;
                    transform: translate(-0.06em, 0.02em);
                    clip-path: inset(8% 0 62% 0);
                }
                25% {
                    transform: translate(0.05em, -0.02em);
                    clip-path: inset(55% 0 12% 0);
                }
                50% {
                    transform: translate(-0.03em, 0);
                    clip-path: inset(30% 0 40% 0);
                }
                75% {
                    transform: translate(0.04em, 0.01em);
                    clip-path: inset(72% 0 5% 0);
                }
                100% {
                    opacity: 0;
                }
            }
            @keyframes glitch-b {
                0% {
                    opacity: 0.9;
                    transform: translate(0.06em, -0.02em);
                    clip-path: inset(60% 0 10% 0);
                }
                25% {
                    transform: translate(-0.05em, 0.02em);
                    clip-path: inset(12% 0 70% 0);
                }
                50% {
                    transform: translate(0.03em, 0);
                    clip-path: inset(44% 0 30% 0);
                }
                75% {
                    transform: translate(-0.04em, -0.01em);
                    clip-path: inset(5% 0 80% 0);
                }
                100% {
                    opacity: 0;
                }
            }
            .hero-sub {
                margin-top: 0.75rem;
                font-family: var(--display);
                font-size: clamp(1.25rem, 4.6vw, 1.75rem);
                font-weight: 600;
                color: var(--magenta);
            }
            .hero-lead {
                margin-top: 1.25rem;
                max-width: 52ch;
                font-size: 1.125rem;
            }
            .hero-note {
                margin-top: 0.75rem;
                max-width: 52ch;
                color: var(--dim);
            }
            .plate-title {
                font-size: 1.125rem;
                font-weight: 600;
                color: var(--cyan);
            }
            .spec {
                margin: 0.75rem 0 0;
            }
            .spec > div {
                display: flex;
                justify-content: space-between;
                gap: 1rem;
                padding: 0.45rem 0;
                border-top: 1px solid var(--line);
            }
            .spec dt {
                color: var(--dim);
                white-space: nowrap;
            }
            .spec dd {
                margin: 0;
                text-align: right;
                font-family: var(--display);
                font-weight: 500;
            }
            .spec .hot {
                color: var(--yellow);
            }

            /* Observation deck: swipe row on phones, grid on wider screens */
            .deck {
                display: grid;
                grid-auto-flow: column;
                grid-auto-columns: 86%;
                gap: 0.875rem;
                margin-top: 1.25rem;
                margin-inline: -1rem;
                padding: 0.25rem 1rem 1rem;
                overflow-x: auto;
                scroll-snap-type: x mandatory;
                scroll-padding-inline: 1rem;
                scrollbar-width: thin;
                scrollbar-color: var(--line) transparent;
            }
            .card {
                --accent: var(--cyan);
                scroll-snap-align: start;
                perspective: 1200px;
                cursor: pointer;
            }
            .c-red {
                --accent: #ff4d6a;
            }
            .c-amber {
                --accent: #ffb52e;
            }
            .c-cyan {
                --accent: #19e6ff;
            }
            .c-purple {
                --accent: #b983ff;
            }
            .c-pink {
                --accent: #ff2e88;
            }
            .c-orange {
                --accent: #ff8a3d;
            }
            .card-inner {
                display: grid;
                height: 100%;
                transform-style: preserve-3d;
                transition: transform 0.5s;
            }
            .card.flipped .card-inner {
                transform: rotateY(180deg);
            }
            .face {
                grid-area: 1 / 1;
                min-width: 0;
                -webkit-backface-visibility: hidden;
                backface-visibility: hidden;
            }
            .face.back {
                transform: rotateY(180deg);
            }
            .card:hover .face,
            .card:focus-within .face {
                --edge: var(--accent);
            }
            .face .plate-body {
                display: flex;
                flex-direction: column;
            }
            .card-title {
                font-size: 1.25rem;
                font-weight: 600;
                color: var(--accent);
                overflow-wrap: anywhere;
            }
            .card-desc {
                margin-top: 0.6rem;
                font-size: 0.9375rem;
            }
            .stat {
                margin-top: auto;
                padding-top: 1rem;
                display: flex;
                align-items: baseline;
                gap: 0.6rem;
            }
            .stat-num {
                font-family: var(--display);
                font-size: 2rem;
                font-weight: 700;
                line-height: 1;
                color: var(--accent);
                white-space: nowrap;
            }
            .stat-label {
                font-size: 0.8125rem;
                color: var(--dim);
            }
            .flip-btn {
                align-self: flex-start;
                margin-top: 0.9rem;
                padding: 0.5rem 0.8rem;
                min-height: 2.75rem;
                border: 1px solid var(--accent);
                background: transparent;
                color: var(--accent);
                font-family: var(--display);
                font-size: 0.875rem;
                font-weight: 500;
                cursor: pointer;
            }
            .flip-btn:hover {
                background: var(--accent);
                color: var(--night);
            }
            .whatif {
                font-family: var(--display);
                font-weight: 500;
                color: var(--accent);
            }
            .sources {
                list-style: none;
                margin: 0.75rem 0 0;
                padding: 0;
            }
            .sources a {
                display: block;
                padding: 0.45rem 0;
                border-top: 1px solid var(--line);
                text-decoration: none;
            }
            .src-title,
            .src-sum {
                display: block;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                font-size: 0.8125rem;
            }
            .src-title {
                color: var(--text);
            }
            .sources a:hover .src-title {
                color: var(--yellow);
            }
            .src-sum {
                color: var(--dim);
            }

            /* Evidence, commitments, take part */
            .columns {
                display: grid;
                gap: 2rem;
            }
            .points {
                margin: 0.75rem 0 0;
                padding: 0;
                list-style: none;
            }
            .points li {
                position: relative;
                padding: 0.5rem 0 0.5rem 1.1rem;
                border-top: 1px solid var(--line);
                font-size: 0.9375rem;
            }
            .points li::before {
                content: "";
                position: absolute;
                left: 0;
                top: 1.05rem;
                width: 0.45rem;
                height: 0.45rem;
                background: var(--magenta);
            }

            .cta {
                display: inline-block;
                margin-top: 1rem;
                padding: 0.7rem 1.1rem;
                background: var(--magenta);
                color: var(--night);
                font-family: var(--display);
                font-weight: 600;
                text-decoration: none;
                clip-path: polygon(
                    0 0,
                    calc(100% - 10px) 0,
                    100% 10px,
                    100% 100%,
                    10px 100%,
                    0 calc(100% - 10px)
                );
            }
            .cta:hover {
                background: var(--yellow);
                color: var(--night);
            }

            footer {
                margin-top: 3.5rem;
                padding: 1.5rem 0 2.5rem;
                border-top: 1px solid var(--line);
                color: var(--dim);
                font-size: 0.875rem;
            }
            footer .wrap {
                display: flex;
                flex-wrap: wrap;
                justify-content: space-between;
                gap: 0.5rem 2rem;
            }
            footer a {
                color: var(--text);
            }

            @media (min-width: 44rem) {
                .deck {
                    grid-auto-flow: row;
                    grid-auto-columns: auto;
                    grid-template-columns: repeat(2, 1fr);
                    margin-inline: 0;
                    padding: 0;
                    overflow: visible;
                }
                .columns {
                    grid-template-columns: repeat(3, 1fr);
                }
            }
            @media (min-width: 62rem) {
                .hero-grid {
                    grid-template-columns: 1.2fr 1fr;
                }
                .deck {
                    grid-template-columns: repeat(3, 1fr);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .glitch::before,
                .glitch::after {
                    animation: none;
                }
                .card-inner {
                    transition: none;
                }
            }
        </style>
    </head>
    <body>
        <main>{{ content }}</main>

        <footer>
            <div class="wrap">
                <p>
                    One hobbyist GPU, one day, and an honest attempt to find
                    out what's possible.
                </p>
                <p>
                    Created by
                    <a href="https://bicepjai.com" target="_blank" rel="noopener">bicepjai</a>
                    ·
                    <a href="https://discord.gg/yXAENX2yN" target="_blank" rel="noopener">Discord</a>
                    ·
                    <a href="https://debugarguments.app/agoge" target="_blank" rel="noopener">Agoge</a>
                </p>
            </div>
        </footer>

        <script>
            // Flip a card to show its sources; keep the hidden face out of tab order
            document.querySelectorAll(".card").forEach((card) => {
                const front = card.querySelector(".front");
                const back = card.querySelector(".back");
                card.addEventListener("click", (e) => {
                    if (e.target.closest("a")) return;
                    const flipped = card.classList.toggle("flipped");
                    front.inert = flipped;
                    back.inert = !flipped;
                    if (e.target.closest(".flip-btn")) {
                        (flipped ? back : front)
                            .querySelector(".flip-btn")
                            .focus({ preventScroll: true });
                    }
                });
            });
        </script>
    </body>
</html>
